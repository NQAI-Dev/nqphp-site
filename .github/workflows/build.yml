name: nqphp-site CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} on Ubuntu

    strategy:
      matrix:
        php: ['8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Syntax check (all PHP files)
        run: |
          find src bin -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Verify routes are discoverable
        run: php bin/console routes:list
