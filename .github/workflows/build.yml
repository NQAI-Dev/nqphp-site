name: nqphp CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} on Ubuntu

    strategy:
      matrix:
        php: ['8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          tools: composer

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Syntax check (all PHP files)
        run: |
          find src tests bin -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run tests
        run: vendor/bin/phpunit

  cs-check:
    runs-on: ubuntu-latest
    needs: build
    if: success()
    name: Code style (php-cs-fixer)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - name: Install dev dependencies (incl. php-cs-fixer)
        run: composer install --prefer-dist --no-progress
      - name: Run cs:check
        run: composer cs:check

  ruleset-ok:
    runs-on: ubuntu-latest
    needs: build
    if: success()
    name: Routeset sanity
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --quiet
      - name: Verify routes are discoverable
        run: php bin/console routes:list
