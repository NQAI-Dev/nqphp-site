name: Deploy to VPS

on:
  workflow_dispatch:
  push:
  workflow_dispatch:
    branches:
  workflow_dispatch:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
  workflow_dispatch:
    steps:
  workflow_dispatch:
      - name: Checkout repository
  workflow_dispatch:
        uses: actions/checkout@v4
  workflow_dispatch:

  workflow_dispatch:
      - name: Setup PHP
  workflow_dispatch:
        uses: shivammathur/setup-php@v2
  workflow_dispatch:
        with:
  workflow_dispatch:
          php-version: '8.2'
  workflow_dispatch:
          tools: composer
  workflow_dispatch:

  workflow_dispatch:
      - name: Install Dependencies
  workflow_dispatch:
        run: composer install --no-dev --optimize-autoloader --no-interaction
  workflow_dispatch:

  workflow_dispatch:
      - name: Deploy via rsync
  workflow_dispatch:
        uses: easingthemes/ssh-deploy@main
  workflow_dispatch:
        env:
  workflow_dispatch:
          SSH_PRIVATE_KEY: *** secrets.VPS_SSH_KEY }}
  workflow_dispatch:
          ARGS: "-rltgoDzvO --delete"
  workflow_dispatch:
          SOURCE: "/"
  workflow_dispatch:
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
  workflow_dispatch:
          REMOTE_USER: ${{ secrets.VPS_USER }}
  workflow_dispatch:
          TARGET: ${{ secrets.VPS_PATH }}
  workflow_dispatch:
          EXCLUDE: "/.git/, /.github/, /vendor/, /node_modules/"
  workflow_dispatch:
